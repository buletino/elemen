          ls -la obrazky
      - name: Commit obrázkov
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add obrazky
          git commit -m "Obrázky Elemenov (webp, 36 ks)" || { echo "žiadna zmena"; exit 0; }
          git push

# Jednorazový (opakovateľný) workflow: stiahne vygenerované obrázky Elemenov,
# zmenší ich na šírku 460 px, uloží ako webp do priečinka obrazky/ a commitne.
# Spúšťa sa ručne (workflow_dispatch) na vetve, na ktorej má obrázky commitnúť.
name: Stiahnutie obrázkov Elemenov

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stiahnut:
    runs-on: ubuntu-latest
    steps:
      - name: Stiahnutie repozitára
        uses: actions/checkout@v4
      - name: Stiahni obrázky
        run: |
          mkdir -p obrazky /tmp/png
          base="https://d8j0ntlcm91z4.cloudfront.net/user_3Efc8WjoJOm0ucmHbvOguU5P18W"
          while read -r id subor; do
            [ -z "$id" ] && continue
            curl -sf --retry 3 -o "/tmp/png/$id.png" "$base/$subor"
            echo "OK $id"
          done <<'ZOZNAM'
          plamienko hf_20260802_071400_bd3f869e-da3e-428a-a0cd-6f60e034ef46.png
          kvapko hf_20260802_193947_ed4b6621-9956-4e05-be4f-ff2f30bef09a.png
          ohnodrak hf_20260802_071416_65c11120-0736-47a4-8fad-a4405ed8e052.png
          sopusik hf_20260802_072510_ecd8d140-27d1-4c28-9187-aae2a54ac188.png
          uhlik hf_20260802_193952_884fd05d-3c9a-4502-80c5-fdbc44965773.png
          zabko hf_20260802_072610_f2012125-f64a-453c-95b5-a23b4a871ca9.png
          perlik hf_20260802_194005_741097d7-c14e-4d8d-95fa-8e57675d78f1.png
          listko hf_20260802_194022_9b1fc5d6-d8ba-4f6b-8f94-92e6189d2a4e.png
          hribik hf_20260802_072807_cb26b0e9-6d6d-4836-bc31-a4e798679ad6.png
          iskrik hf_20260802_194353_33e9be20-5e7b-407e-a10e-da4c677d6f78.png
          burko hf_20260802_194104_64255a56-6f99-4594-8dfd-2c9688670067.png
          ohnivec hf_20260802_194116_1333523c-eb9f-47bd-9cdf-c297a3147564.png
          iskrak hf_20260802_073113_b7ee8cb0-2bed-496e-9593-3c9c259f6b69.png
          hromoborec hf_20260802_194219_3d106505-cda5-4c1b-8f80-d365509bd954.png
          kvapkac hf_20260802_194123_5dc23384-fb7b-4ba0-99ff-f9c3e5648254.png
          vlnobijec hf_20260802_073149_7fa703f0-cf26-4112-8bad-26262430c91a.png
          listovec hf_20260802_073154_6089570a-027c-47dc-a8a2-bfe18ee414db.png
          pralesak hf_20260802_194209_cfb32839-fc4b-4d25-aba4-259f44b86078.png
          ostrik hf_20260802_194739_6b8d1bf0-e1ad-43f8-8b42-6a0f61f799c2.png
          svetluska hf_20260802_193944_7a3b0bff-d151-449c-93b7-3c74d0088262.png
          kvetko hf_20260802_073233_eea2e962-2904-4b4c-a7cd-bef4f8489dd0.png
          potapko hf_20260802_073238_9341ad53-0aeb-4256-93da-5c7ba7def4a7.png
          zeravik hf_20260802_194154_fddc0edc-1f60-4dca-aa75-f6f22863d5d1.png
          mrazik hf_20260802_194340_b35d765b-13bf-45a7-b9a8-059721fcdac7.png
          machko hf_20260802_073354_354c2673-2766-46b7-828d-535518cc0bbc.png
          ohnivko hf_20260802_194159_75ff5f70-e5ac-4ca4-abc5-e34db0a9ac65.png
          bleskonoh hf_20260802_194457_f54456b6-af6b-406e-82d2-35dbe57a7cf8.png
          vlnka hf_20260802_073447_bace7c64-cb12-4feb-94f6-3521930db989.png
          motylik hf_20260802_073455_13ea5e47-9c19-45d4-8302-7414ebf96511.png
          kridlokvet hf_20260802_073514_3b8cd971-d557-4b97-ab76-0429bdba00db.png
          blyskotak hf_20260802_073521_b6c3138c-d121-4756-89cb-bbdf384ea571.png
          burkokridlo hf_20260802_073533_eaa01e4b-a761-43a0-9367-e28e5a92db63.png
          ladovec hf_20260802_073552_6c95decb-8e65-496a-b773-0afc9ddd8715.png
          mrazivec hf_20260802_073601_8dd3d40b-d4ba-41aa-8080-80dde961d03c.png
          burkonoh hf_20260802_073606_bfd7d3b2-be5f-4352-8257-0e563fbe15d6.png
          hromokon hf_20260802_194334_a2158825-a3f5-4768-b118-c9c8a47effd4.png
          ZOZNAM
          ls /tmp/png | wc -l
      - name: Zmenši na webp (Pillow)
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          import os
          from PIL import Image
          for f in sorted(os.listdir('/tmp/png')):
              im = Image.open(f'/tmp/png/{f}').convert('RGB')
              w = 460
              h = round(im.height * w / im.width)
              im.resize((w, h), Image.LANCZOS).save(f"obrazky/{f[:-4]}.webp", 'WEBP', quality=82)
              print('webp', f)
          PY
          ls -la obrazky
      - name: Commit obrázkov
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add obrazky
          git commit -m "Obrázky Elemenov (webp, 36 ks)" || { echo "žiadna zmena"; exit 0; }
          git push
